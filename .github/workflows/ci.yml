# Merge gates: every step must pass. Actions are pinned to commit SHAs
# (supply-chain policy — tags can be moved, SHAs cannot).
name: CI

# Feature work always goes through a PR (branch protection), so PR events
# cover dev; push covers main after merge (keeps badges fresh) without
# duplicating runs on dev branches.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here writes to the repo, and checkouts do not
# persist credentials, so no step after checkout holds a usable token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Ruff lint (select = ALL)
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy

      - name: Tests with coverage (100% floor in pyproject)
        run: uv run pytest

      - name: Export lockfile for audit
        run: uv export --frozen --no-emit-project --output-file requirements-audit.txt

      - name: pip-audit (known CVEs)
        run: uv run pip-audit --disable-pip --requirement requirements-audit.txt

  # The site embeds source snippets; a moved or renamed snippet must fail
  # the PR that moved it, not the deploy after merge. --strict promotes
  # mkdocs warnings (missing snippet, dead nav link) to errors.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3" # Newest uv release >= 7 days old when pinned.
          enable-cache: true

      - name: Sync locked dependencies (docs group)
        run: uv sync --locked --group docs

      - name: Build site (strict)
        run: uv run mkdocs build --strict
